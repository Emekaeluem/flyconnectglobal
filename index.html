<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fly Connect Global — Expert Support For Your Travel</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@400,500,600&display=swap">
<style>
  :root {
    --navy: #0B1B56;
    --navy-deep: #060D2E;
    --gold: #FEBD00;
    --white: #FFFFFF;
    --display: 'Clash Display', sans-serif;
    --sans: 'General Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--navy-deep);
    color: var(--white);
  }

  .hero {
    position: relative;
    width: 100%;
    height: 100svh;
    min-height: 560px;
    overflow: hidden;
  }

  .hero__video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background-color: var(--navy);
  }

  .hero__overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(6,13,46,0.55) 0%, rgba(6,13,46,0.15) 32%, rgba(6,13,46,0.35) 60%, rgba(6,13,46,0.92) 100%),
      linear-gradient(90deg, rgba(6,13,46,0.75) 0%, rgba(6,13,46,0.15) 55%);
  }

  .hero__content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* Nav */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 5vw 0;
  }

  .nav__logo img {
    height: 34px;
    width: auto;
    display: block;
  }

  .nav__cta {
    font-family: var(--sans);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--white);
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 10px 22px;
    border-radius: 999px;
    transition: border-color 0.25s ease, background-color 0.25s ease;
    white-space: nowrap;
  }

  .nav__cta:hover,
  .nav__cta:focus-visible {
    border-color: var(--gold);
    background-color: rgba(254,189,0,0.1);
  }

  /* Hero copy block */
  .hero__body {
    margin-top: auto;
    padding: 0 5vw 9vh;
    max-width: 720px;
  }

  .hero__headline {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(2.6rem, 6.4vw, 5rem);
    line-height: 1.04;
    letter-spacing: -0.01em;
    color: var(--white);
    opacity: 0;
    transform: translateY(18px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
  }

  .hero__actions {
    margin-top: 40px;
    opacity: 0;
    transform: translateY(14px);
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 600;
    color: var(--navy-deep);
    background: var(--gold);
    text-decoration: none;
    padding: 16px 30px;
    border-radius: 999px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 8px 24px rgba(254,189,0,0.25);
  }

  .btn-primary:hover,
  .btn-primary:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(254,189,0,0.35);
  }

  .btn-primary svg {
    width: 16px;
    height: 16px;
    transition: transform 0.25s ease;
  }

  .btn-primary:hover svg { transform: translateX(3px); }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero__headline, .hero__actions {
      animation: none;
      opacity: 1;
      transform: none;
    }
    html { scroll-behavior: auto; }
  }

  @media (max-width: 640px) {
    .nav { padding: 22px 6vw 0; }
    .nav__logo img { height: 26px; }
    .nav__cta { padding: 8px 16px; font-size: 0.82rem; }
    .hero__body { padding: 0 6vw 8vh; }
  }
</style>
</head>
<body>

<section class="hero">
  <video
    class="hero__video"
    src="https://raw.githubusercontent.com/Emekaeluem/flyconnectglobal/main/images/flyvideo1.mp4"
    autoplay
    muted
    loop
    playsinline
  ></video>
  <div class="hero__overlay"></div>

  <div class="hero__content">
    <nav class="nav">
      <a href="/" class="nav__logo">
        <img src="https://raw.githubusercontent.com/Emekaeluem/flyconnectglobal/main/images/lightlogo.png" alt="Fly Connect Global">
      </a>
      <a href="#contact" class="nav__cta">Talk to Us</a>
    </nav>

    <div class="hero__body">
      <h1 class="hero__headline">Expert Support For Your Travel</h1>
      <div class="hero__actions">
        <a href="#find-route" class="btn-primary">
          Find My Route
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>
</section>

</body>
</html>
