<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Services | Fly Connect Global</title>

  <!-- KEEP YOUR EXISTING CSS FILE -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ========================================
       KEEP YOUR EXISTING WEBSITE HEADER HERE
       Use the exact same header/nav from index.html
  ========================================= -->


  <!-- ========================================
       SERVICES HERO
  ========================================= -->
  <main>

    <section class="services-hero">

      <!-- Soft concentric background -->
      <div class="services-hero-rings" aria-hidden="true">
        <span class="service-ring service-ring-1"></span>
        <span class="service-ring service-ring-2"></span>
        <span class="service-ring service-ring-3"></span>
        <span class="service-ring service-ring-4"></span>
      </div>


      <!-- Small floating decorative cards -->
      <div class="services-floating-card services-floating-card-left" aria-hidden="true">
        <div class="services-floating-icon">
          <span>✈</span>
        </div>
      </div>

      <div class="services-floating-card services-floating-card-right" aria-hidden="true">
        <div class="services-floating-icon">
          <span>◎</span>
        </div>
      </div>


      <!-- Main hero content -->
      <div class="services-hero-content">

        <span class="services-eyebrow">
          Our Services
        </span>

        <h1>
          Your global journey,
          <span>all in one place.</span>
        </h1>

        <p>
          From studying abroad and visa support to travel,
          work opportunities and global pathways, we provide
          the guidance you need at every step.
        </p>

        <a href="#our-services" class="services-hero-btn">
          <span>Explore our services</span>

          <span class="services-hero-btn-arrow">
            →
          </span>
        </a>

      </div>

    </section>


    <!-- Your service sections will continue here -->
    <section id="our-services">
      <!-- Services cards/content -->
    </section>

  </main>


  <!-- ========================================
       KEEP YOUR EXISTING WEBSITE FOOTER HERE
